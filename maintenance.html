<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>OpportunityBox CRM — Em manutenção</title>
<style>
  :root{color-scheme:light dark}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0f1115;color:#e8e8ea;padding:24px;box-sizing:border-box;
  }
  .card{
    max-width:480px;width:100%;text-align:center;
    background:#181b21;border:1px solid #2a2e37;border-radius:16px;
    padding:40px 32px;
  }
  .icon{font-size:40px;margin-bottom:12px}
  h1{font-size:20px;margin:0 0 12px;color:#fff}
  p{font-size:15px;line-height:1.6;color:#b7bcc7;margin:0 0 8px}
  .foot{margin-top:24px;font-size:12px;color:#6b7280}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>CRM temporariamente indisponível</h1>
    <p>Estamos a reforçar a segurança e a proteção dos dados da plataforma.</p>
    <p>Voltamos assim que a manutenção estiver concluída.</p>
    <div class="foot">OpportunityBox</div>
  </div>
</body>
</html>
