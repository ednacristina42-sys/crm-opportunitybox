[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Modo de manutenção desativado em 2026-07-28, a pedido, para visualização.
# As falhas de segurança identificadas na auditoria (login sem autenticação
# real, RLS efetivamente aberta na base de dados) continuam por corrigir —
# ver backups/2026-07-27-pre-security-migration/ e docs/fase2-*.md no
# branch claude/crm-opportunitybox-cleanup-q737hx.

# O CRM é um único ficheiro HTML sem nome com hash — sem isto, browsers e o
# CDN da Netlify podem continuar a servir uma cópia em cache mesmo depois de
# um novo deploy, fazendo parecer que as alterações "não chegaram".
[[headers]]
for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
