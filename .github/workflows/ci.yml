name: Opportunity AI OS CI

on:
  pull_request:
    paths:
      - 'opportunity-ai-os/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'opportunity-ai-os/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opportunity-ai-os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: opportunity-ai-os/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
